[package]
name = "clipbridge"
version = "1.0.1"
edition = "2021"
description = "iPhone <-> Windows clipboard bridge over the local network"
license = "MIT"
repository = "https://github.com/BatuhanCakmakk/clipbridge"

[dependencies]
tiny_http = "0.12"
tray-icon = "0.21"
clipboard-win = "5"
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg", "gif", "webp", "tiff"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
local-ip-address = "0.6"
winreg = "0.55"
tauri-winrt-notification = "0.7"
zip = { version = "2", default-features = false, features = ["deflate"] }
percent-encoding = "2"
memchr = "2"
resvg = { version = "0.45", default-features = false }
windows = { version = "0.58", features = ["Win32_Graphics_Imaging", "Win32_System_Com", "Win32_Foundation"] }
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_Globalization", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }
ureq = { version = "3", default-features = false, features = ["native-tls"] }
mdns-sd = "0.21"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
