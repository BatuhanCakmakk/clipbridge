name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          Copy-Item target/release/clipbridge.exe ClipBridge.exe
          (Get-FileHash ClipBridge.exe -Algorithm SHA256).Hash.ToLower() + "  ClipBridge.exe" | Out-File ClipBridge.exe.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: ClipBridge
          path: |
            ClipBridge.exe
            ClipBridge.exe.sha256
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ClipBridge.exe
            ClipBridge.exe.sha256
          generate_release_notes: true
